<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C" />
      <stop offset="50%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Cyber Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Monogram CE / F (Clean Geometric Cyber Minimalist) -->
  <g filter="url(#neonGlow)">
    <!-- Letter C -->
    <path 
      d="M 27 20 H 19 C 15.686 20 13 22.686 13 26 V 38 C 13 41.314 15.686 44 19 44 H 27" 
      stroke="url(#cyanGrad)" 
      stroke-width="4.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <!-- Node on C -->
    <circle cx="27" cy="20" r="1.8" fill="#FFFFFF" />

    <!-- Letter E / F Spine -->
    <path 
      d="M 35 20 V 44" 
      stroke="url(#cyanGrad)" 
      stroke-width="4.5" 
      stroke-linecap="round" 
    />

    <!-- Top Bar -->
    <path 
      d="M 35 20 H 48" 
      stroke="url(#cyanGrad)" 
      stroke-width="4.5" 
      stroke-linecap="round" 
    />
    <circle cx="48" cy="20" r="1.8" fill="#FFFFFF" />

    <!-- Middle Bar (F notch) -->
    <path 
      d="M 35 32 H 44" 
      stroke="url(#cyanGrad)" 
      stroke-width="4.2" 
      stroke-linecap="round" 
    />
    <circle cx="44" cy="32" r="1.6" fill="#FFFFFF" />

    <!-- Bottom Accent (Circuit Node completing CE & F) -->
    <path 
      d="M 35 44 H 42" 
      stroke="url(#cyanGrad)" 
      stroke-width="4.5" 
      stroke-linecap="round" 
    />
    <circle cx="48" cy="44" r="2.2" fill="#00F0FF" />
  </g>
</svg>
